name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Standalone APK
        run: |
          set -e
          APP_DIR="$RUNNER_TEMP/pt_app"
          rm -rf "$APP_DIR"
          
          # 1. Fresh standalone Flutter project
          flutter create --org com.pakistantools --project-name pakistan_tools "$APP_DIR"
          cd "$APP_DIR"

          # 2. Add dependencies
          flutter pub add http url_launcher

          # 3. Replace main.dart with your complete UI code
          cp -f "$GITHUB_WORKSPACE/lib/main.dart" lib/main.dart

          # 4. Set minimum SDK to 21
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle 2>/dev/null || true

          # 5. Build Direct Universal APK (No NDK crashes)
          flutter build apk --debug

          # 6. Copy output to workspace
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/output/PakistanTools.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PakistanTools-APK
          path: output/PakistanTools.apk
