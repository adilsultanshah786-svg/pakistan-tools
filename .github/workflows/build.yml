name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean Build Pipeline
        run: |
          mkdir -p /tmp/builder
          cd /tmp/builder
          flutter config --no-analytics
          flutter create --org com.pakistantools pakistantools_app
          cd pakistantools_app
          flutter pub add http url_launcher
          cp -f $GITHUB_WORKSPACE/lib/main.dart lib/main.dart
          flutter build apk --release --no-tree-shake-icons
          mkdir -p $GITHUB_WORKSPACE/build_output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/build_output/PakistanTools.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PakistanTools-APK
          path: build_output/PakistanTools.apk
