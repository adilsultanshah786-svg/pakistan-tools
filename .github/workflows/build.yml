name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create and Build Android APK
        run: |
          set -e
          # 1. Fresh clean workspace
          cd $RUNNER_TEMP
          flutter config --no-analytics
          flutter create --org com.pakistantools --platforms=android myapp
          cd myapp

          # 2. Add dependencies
          flutter pub add http url_launcher

          # 3. Copy our main.dart UI
          cp -f $GITHUB_WORKSPACE/lib/main.dart lib/main.dart

          # 4. Compile Release APK
          flutter build apk --release --no-tree-shake-icons

          # 5. Move APK to repository workspace
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/PakistanTools.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PakistanTools-APK
          path: output/PakistanTools.apk
